<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071d19">
<title>قاعة جوستك | للمناسبات والجلسات الراقية</title>
<style>
:root{color-scheme:dark;--gold:#e6c77d;--cream:#f6ecd0;--green:#071d19}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 8%,#214b3d 0,#102b23 35%,#061611 78%);color:var(--cream);font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1080px,100%);margin:auto;padding:28px 22px 48px}.top{text-align:center;padding:30px 0 26px}.mark{width:62px;height:62px;margin:auto auto 14px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:27px;box-shadow:0 0 30px #d1ad6740}.eyebrow{color:var(--gold);font-size:14px;letter-spacing:2px}.top h1{font-size:clamp(34px,8vw,68px);margin:10px 0;color:var(--gold);font-weight:700}.top p{font-size:clamp(16px,3vw,21px);color:#e5ddca;margin:0}.poster{width:min(680px,100%);margin:12px auto 26px;overflow:hidden;border:1px solid #d7b76c;border-radius:18px;background:#081a14;box-shadow:0 24px 70px #0009}.poster img{display:block;width:100%;height:auto}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:0 auto 32px}.btn{display:inline-block;padding:14px 24px;border-radius:99px;text-decoration:none;font-weight:bold;border:1px solid var(--gold);color:#111d16;background:linear-gradient(135deg,#f4df9f,#bd944a);box-shadow:0 8px 26px #c39d4a26}.btn.alt{color:var(--cream);background:#0a211a}.about{max-width:760px;margin:auto;padding:24px 25px;border:1px solid #b9954f75;border-radius:18px;background:#061712a8;text-align:center}.about h2{margin:0 0 10px;color:var(--gold);font-size:24px}.about p{margin:0;color:#e6decd;line-height:1.9}.manager{margin-top:20px;padding-top:17px;border-top:1px solid #b9954f55;color:#e6c77d}.manager strong{display:block;margin-top:6px;color:#fff3d2;font-size:20px}footer{text-align:center;color:#bba873;font-size:13px;margin-top:25px}@media(max-width:520px){.wrap{padding:16px 14px 32px}.top{padding-top:24px}.poster{border-radius:12px}.about{padding:20px 16px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="mark" aria-hidden="true">✦</div><div class="eyebrow">أهلاً وسهلاً بكم</div><h1>قاعة جوستك</h1><p>للمناسبات والجلسات الراقية</p></header>
<figure class="poster"><img src="../jostik-hall.svg" alt="تصميم قاعة جوستك بإدارة عباس عبد الحسين العرباوي"></figure>
<nav class="actions" aria-label="روابط التصميم"><a class="btn" href="../jostik-hall.svg" target="_blank" rel="noopener">شاهد الصورة بالحجم الكامل</a><a class="btn alt" href="../jostik-hall.svg" download="jostik-hall.svg">حمّل الصورة</a></nav>
<section class="about"><h2>مكان يليق بفرحتكم</h2><p>أجواء أنيقة للمناسبات والجلسات، مع ضيافة ولمسات من الفخامة حتى تكون مناسبتكم ذكرى حلوة.</p><div class="manager">بإدارة<strong>عباس عبد الحسين العرباوي</strong></div></section>
<footer>قاعة جوستك · أهلاً بكم دائماً</footer>
</main>
</body>
</html>
